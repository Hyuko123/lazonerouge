name: Node.js validation
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: node --check src/index.js
      - run: node --check src/handlers.js
      - run: node --check src/commands.js
      - run: node --check src/database.js
